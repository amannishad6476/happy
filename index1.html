<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday A...</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:#000;
overflow:hidden;
font-family:Georgia, serif;
}

.container{
position:relative;
text-align:center;
z-index:10;
}

.small{
font-size:28px;
color:white;
letter-spacing:10px;
}

.big{
font-size:100px;
font-weight:bold;
color:#fff;
letter-spacing:15px;
animation:fire 2s infinite alternate;
}

.name{
margin-top:25px;
font-size:40px;
color:#ff8dc7;
}

.date{
font-size:22px;
color:#ffd6eb;
margin-top:10px;
}

@keyframes fire{
0%{
text-shadow:
0 0 10px #fff,
0 0 20px #ffd700,
0 0 40px orange,
0 0 80px red;
}

100%{
text-shadow:
0 0 20px white,
0 0 40px orange,
0 0 80px #ff6600,
0 0 120px red;
}
}

/* Stars */

.star{
position:absolute;
color:white;
animation:blink 2s infinite alternate;
}

@keyframes blink{
from{opacity:.2;}
to{opacity:1;}
}

.s1{top:10%;left:15%;}
.s2{top:25%;left:80%;}
.s3{top:70%;left:20%;}
.s4{top:80%;left:85%;}

</style>
</head>

<body>

<div class="star s1">✨</div>
<div class="star s2">✨</div>
<div class="star s3">✨</div>
<div class="star s4">✨</div>

<div class="container">

<div class="small">HAPPY</div>

<div class="big">BIRTHDAY</div>

<div class="small">TO YOU</div>

<div class="name">❤️ A.. ❤️</div>

<div class="date">🎂 Hmesha muskurate rahna kabhi apne liye to
     kabhi apno ke liye🎂</div>

</div>
<style>

/* Left Flower */
.flower-left,
.flower-right{
position:absolute;
width:180px;
height:180px;
animation:rotate 15s linear infinite;
}

.flower-left{
left:50px;
top:35%;
}

.flower-right{
right:50px;
top:35%;
}

.petal{
position:absolute;
width:70px;
height:70px;
background:#ff69b4;
border-radius:50%;
box-shadow:0 0 20px #ff69b4;
}

.p1{top:0;left:55px;}
.p2{top:55px;left:0;}
.p3{top:55px;right:0;}
.p4{bottom:0;left:55px;}
.p5{
top:55px;
left:55px;
background:#ffd700;
box-shadow:0 0 20px gold;
}

.leaf{
position:absolute;
width:50px;
height:25px;
background:#00cc66;
border-radius:50%;
}

.l1{
left:-30px;
top:130px;
transform:rotate(-40deg);
}

.l2{
right:-30px;
top:130px;
transform:rotate(40deg);
}

@keyframes rotate{
100%{
transform:rotate(360deg);
}
}

</style>

<div class="flower-left">
<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>
<div class="petal p5"></div>

<div class="leaf l1"></div>
<div class="leaf l2"></div>
</div>

<div class="flower-right">
<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>
<div class="petal p5"></div>

<div class="leaf l1"></div>
<div class="leaf l2"></div>
</div>
<style>

/* Sparkles */
.sparkle{
position:absolute;
font-size:20px;
color:white;
animation:twinkle 2s infinite alternate;
}

.sp1{top:15%;left:10%;}
.sp2{top:20%;right:15%;}
.sp3{bottom:20%;left:20%;}
.sp4{bottom:15%;right:10%;}
.sp5{top:50%;left:5%;}
.sp6{top:50%;right:5%;}

@keyframes twinkle{
0%{
opacity:.2;
transform:scale(.8);
}
100%{
opacity:1;
transform:scale(1.3);
}
}

/* Falling petals */
.petal-fall{
position:absolute;
top:-20px;
font-size:25px;
animation:fall linear infinite;
}

.pf1{left:10%;animation-duration:8s;}
.pf2{left:30%;animation-duration:10s;}
.pf3{left:50%;animation-duration:7s;}
.pf4{left:70%;animation-duration:9s;}
.pf5{left:90%;animation-duration:11s;}

@keyframes fall{
0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:.3;
}
}

.footer{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
color:#ac7980;
font-size:18px;
letter-spacing:3px;
}

</style>

<div class="sparkle sp1">✨</div>
<div class="sparkle sp2">✨</div>
<div class="sparkle sp3">✨</div>
<div class="sparkle sp4">✨</div>
<div class="sparkle sp5">✨</div>
<div class="sparkle sp6">✨</div>

<div class="petal-fall pf1">🌸</div>
<div class="petal-fall pf2">🌸</div>
<div class="petal-fall pf3">🌸</div>
<div class="petal-fall pf4">🌸</div>
<div class="petal-fall pf5">🌸</div>

<div class="footer">
❤️ Happy Birthday P.. ❤️ <br>
🎂 8 February 🎂
</div>

</body>
</html>
